name: quality

on:
  push:
    branches:
      - main
      - 'abdul/**'
  pull_request:

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check signature.js

      - name: Run static quality audit
        run: python3 scripts/quality_check.py

      - name: Install preview/build dependency
        run: npm install --no-audit --no-fund

      - name: Build production bundle
        run: npm run build
